spring:
  application:
    name: booktickets

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booktickets}
    username: ${SPRING_DATASOURCE_USERNAME:booktickets}
    password: ${SPRING_DATASOURCE_PASSWORD:booktickets}
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
        default-requeue-rejected: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

booking:
  lock:
    enabled: true
    wait-seconds: 2
    lease-seconds: 5
  confirmation:
    min-delay-ms: 100
    max-delay-ms: 500
    simulated-failure-rate: 0.05
    max-retries: 3

logging:
  level:
    com.bookings.booktickets: INFO
